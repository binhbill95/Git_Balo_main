version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: balo_postgres
    restart: unless-stopped
    environment:
      # Lấy từ file .env (thư mục gốc) — xem .env.example ở mục README
      POSTGRES_USER: ${POSTGRES_USER:-balo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-balo_store}
    ports:
      - "5433:5432"
    volumes:
      - balo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-balo_admin} -d ${POSTGRES_DB:-balo_store}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  balo_pg_data: