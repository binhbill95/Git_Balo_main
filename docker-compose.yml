version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: balo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: balo_admin
      POSTGRES_PASSWORD: balo_secret_123
      POSTGRES_DB: balo_store
    ports:
      - "5433:5432"
    volumes:
      - balo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balo_admin -d balo_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  balo_pg_data: